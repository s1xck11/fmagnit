plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.s1xck.fmagnit"
    compileSdk 34

    defaultConfig {
        applicationId "com.s1xck.fmagnit"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packagingOptions {
        // BRouter тянет много нативных библиотек, исключаем дубликаты
        pickFirst '**/libc++_shared.so'
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    implementation "androidx.core:core-ktx:1.12.0"

    // НОВОЕ: BRouter как библиотека через JitPack
    // Версия 1.7.5 — последняя стабильная на момент написания
    // Если не найдётся — заменить на "com.github.abrensch.brouter:brouter-core:1.7.5"
    implementation "com.github.abrensch.brouter:brouter-core:1.7.5"

    // OSMDroid (уже должен быть, проверяем)
    implementation "org.osmdroid:osmdroid-android:6.1.18"
}
