plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Ключ MapKit приходит из секрета GitHub через android/mapkit.properties (workflow).
// В репо файл не коммитится. Нет файла/ключа -> пустая строка -> fallback на OSM.
def mapkitPropsFile = rootProject.file("mapkit.properties")
def mapkitKey = ""
if (mapkitPropsFile.exists()) {
    def mp = new Properties()
    mapkitPropsFile.withReader('UTF-8') { reader -> mp.load(reader) }
    mapkitKey = mp.getProperty('MAPKIT_API_KEY', '')
}

android {
    namespace "com.s1xck.fmagnit"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    sourceSets { main.java.srcDirs += 'src/main/kotlin' }

    buildFeatures { buildConfig true }

    defaultConfig {
        // Пакет 2ГИС: курьерка шлёт интенты карт именно в него.
        applicationId "ru.dublgis.dgismobile"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        buildConfigField "String", "MAPKIT_API_KEY", "\"${mapkitKey}\""

        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    // Отключаем параноидальную проверку MockLocation для релиза
    lint {
        disable 'MockLocation'
    }
}

flutter { source '../..' }

dependencies {
    implementation "org.osmdroid:osmdroid-android:6.1.18"
    // MapKit full до перехода на Java 21-байткод (4.45 = major 65, не читается нашим ASM).
    // 4.13: карта + пробки + геокод + маршруты авто/вело/электровел/пешком.
    implementation "com.yandex.android:maps.mobile:4.13.0-full"
}