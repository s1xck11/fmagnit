// Примечание: Репозитории теперь управляются в settings.gradle через dependencyResolutionManagement.
// Блок allprojects удалён, чтобы избежать конфликтов Gradle.

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
